app = "holmes-stats"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[checks.health]
  grace_period = "10s"
  interval = "30s"
  method = "get"
  path = "/healthz"
  timeout = "5s"
